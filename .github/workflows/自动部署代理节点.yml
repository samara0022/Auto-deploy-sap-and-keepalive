name: 自动部署代理到SAP

on:
  workflow_dispatch:
    inputs:
      type:
        description: '选择部署的节点类型'
        required: true
        default: 'Argo隧道CDN'
        type: choice
        options:
          - ws直连
          - xhttp直连
          - Argo隧道CDN
      region:
        description: '选择部署区域'
        required: true
        default: 'US(free)'
        type: choice
        options:
          - SG(free)
          - US(free)
          - SAP-UAE(Dubai)
          - SAP-AU(Sydney)
          - SAP-US(Sterling)
          - SAP-US-West(Colorado)
          - SAP-JP(Tokyo)
          - AWS-AU(Sydney)
          - AWS-BR(São Paulo)
          - AWS-KR(Seoul)
          - AWS-CA(Montreal)
          - AWS-US(VA)
          - AWS-US(OR)
          - AWS-EU(Frankfurt)
          - AWS-JP(Tokyo)
          - AWS-SG(Singapore)
          - GCP-AU(Sydney)
          - GCP-BR(São Paulo)
          - GCP-US(IA)
          - GCP-EU(Frankfurt)
          - GCP-JP(Osaka)
          - GCP-JP(Tokyo)
          - GCP-IL(Tel Aviv)
          - GCP-IN(Mumbai)
          - GCP-KSA(Dammam)
          - Azure-AU(Sydney)
          - Azure-BR(São Paulo)
          - Azure-CA(Montreal)
          - Azure-US(VA)
          - Azure-US(WA)
          - Azure-EU(Netherlands)
          - Azure-JP(Tokyo)
          - Azure-SG(Singapore)
          - Neo-UAE(Dubai)
          - Neo-KSA(Riyadh)
      app_name:
        description: '应用名称（可选，留空则自动生成）'
        required: false
        default: ''

env:
  MEMORY: 256M
  DISK: 300M

jobs:
  deploy-app:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install CF CLI
      run: |
        wget -q -O - https://packages.cloudfoundry.org/debian/cli.cloudfoundry.org.key | sudo apt-key add -
        echo "deb https://packages.cloudfoundry.org/debian stable main" | sudo tee /etc/apt/sources.list.d/cloudfoundry-cli.list
        sudo apt-get update
        sudo apt-get install -y cf8-cli

    - name: 确定参数、登录并部署
      run: |
        # ── 1. 确定 CF_API 和默认 APP_NAME ──
        RANDOM_STR=$(head /dev/urandom | tr -dc 'a-z' | head -c 6)

        case "${{ github.event.inputs.region }}" in
          "SG(free)")         CF_API="https://api.cf.ap21.hana.ondemand.com";    APP_NAME="free-sg$RANDOM_STR" ;;
          "US(free)")         CF_API="https://api.cf.us10-001.hana.ondemand.com"; APP_NAME="free-us$RANDOM_STR" ;;
          "SAP-UAE(Dubai)")   CF_API="https://api.cf.ae01.hana.ondemand.com";    APP_NAME="sap-ae$RANDOM_STR" ;;
          "SAP-AU(Sydney)")   CF_API="https://api.cf.ap01.hana.ondemand.com";    APP_NAME="sap-ap$RANDOM_STR" ;;
          "SAP-US(Sterling)") CF_API="https://api.cf.us01.hana.ondemand.com";    APP_NAME="sap-us1$RANDOM_STR" ;;
          "SAP-US-West(Colorado)") CF_API="https://api.cf.us02.hana.ondemand.com"; APP_NAME="sap-us2$RANDOM_STR" ;;
          "SAP-JP(Tokyo)")    CF_API="https://api.cf.jp01.hana.ondemand.com";    APP_NAME="sap-jp$RANDOM_STR" ;;
          "AWS-AU(Sydney)")   CF_API="https://api.cf.ap10.hana.ondemand.com";    APP_NAME="aws-au$RANDOM_STR" ;;
          "AWS-BR(São Paulo)") CF_API="https://api.cf.br10.hana.ondemand.com";   APP_NAME="aws-br$RANDOM_STR" ;;
          "AWS-KR(Seoul)")    CF_API="https://api.cf.ap12.hana.ondemand.com";    APP_NAME="aws-kr$RANDOM_STR" ;;
          "AWS-CA(Montreal)") CF_API="https://api.cf.ca10.hana.ondemand.com";    APP_NAME="aws-ca$RANDOM_STR" ;;
          "AWS-US(VA)")       CF_API="https://api.cf.us10-001.hana.ondemand.com"; APP_NAME="aws-usva$RANDOM_STR" ;;
          "AWS-US(OR)")       CF_API="https://api.cf.us11.hana.ondemand.com";    APP_NAME="aws-usor$RANDOM_STR" ;;
          "AWS-EU(Frankfurt)") CF_API="https://api.cf.eu10-005.hana.ondemand.com"; APP_NAME="aws-eu$RANDOM_STR" ;;
          "AWS-JP(Tokyo)")    CF_API="https://api.cf.jp10.hana.ondemand.com";    APP_NAME="aws-jp$RANDOM_STR" ;;
          "AWS-SG(Singapore)") CF_API="https://api.cf.ap11.hana.ondemand.com";   APP_NAME="aws-sg$RANDOM_STR" ;;
          "GCP-AU(Sydney)")   CF_API="https://api.cf.ap30.hana.ondemand.com";    APP_NAME="gcp-au$RANDOM_STR" ;;
          "GCP-BR(São Paulo)") CF_API="https://api.cf.br30.hana.ondemand.com";   APP_NAME="gcp-br$RANDOM_STR" ;;
          "GCP-US(IA)")       CF_API="https://api.cf.us30.hana.ondemand.com";    APP_NAME="gcp-us$RANDOM_STR" ;;
          "GCP-EU(Frankfurt)") CF_API="https://api.cf.eu30.hana.ondemand.com";   APP_NAME="gcp-eu$RANDOM_STR" ;;
          "GCP-JP(Osaka)")    CF_API="https://api.cf.jp30.hana.ondemand.com";    APP_NAME="gcp-jpo$RANDOM_STR" ;;
          "GCP-JP(Tokyo)")    CF_API="https://api.cf.jp31.hana.ondemand.com";    APP_NAME="gcp-jpt$RANDOM_STR" ;;
          "GCP-IL(Tel Aviv)") CF_API="https://api.cf.il30.hana.ondemand.com";    APP_NAME="gcp-il$RANDOM_STR" ;;
          "GCP-IN(Mumbai)")   CF_API="https://api.cf.in30.hana.ondemand.com";    APP_NAME="gcp-in$RANDOM_STR" ;;
          "GCP-KSA(Dammam)")  CF_API="https://api.cf.sa31.hana.ondemand.com";    APP_NAME="gcp-sa$RANDOM_STR" ;;
          "Azure-AU(Sydney)") CF_API="https://api.cf.ap20.hana.ondemand.com";    APP_NAME="az-au$RANDOM_STR" ;;
          "Azure-BR(São Paulo)") CF_API="https://api.cf.br20.hana.ondemand.com"; APP_NAME="az-br$RANDOM_STR" ;;
          "Azure-CA(Montreal)") CF_API="https://api.cf.ca20.hana.ondemand.com";  APP_NAME="az-ca$RANDOM_STR" ;;
          "Azure-US(VA)")     CF_API="https://api.cf.us21.hana.ondemand.com";    APP_NAME="az-va$RANDOM_STR" ;;
          "Azure-US(WA)")     CF_API="https://api.cf.us20.hana.ondemand.com";    APP_NAME="az-wa$RANDOM_STR" ;;
          "Azure-EU(Netherlands)") CF_API="https://api.cf.eu20-001.hana.ondemand.com"; APP_NAME="az-eu$RANDOM_STR" ;;
          "Azure-JP(Tokyo)")  CF_API="https://api.cf.jp20.hana.ondemand.com";    APP_NAME="az-jp$RANDOM_STR" ;;
          "Azure-SG(Singapore)") CF_API="https://api.cf.ap21.hana.ondemand.com"; APP_NAME="az-sg$RANDOM_STR" ;;
          "Neo-UAE(Dubai)")   CF_API="https://api.cf.neo-ae1.hana.ondemand.com"; APP_NAME="neo-uae$RANDOM_STR" ;;
          "Neo-KSA(Riyadh)")  CF_API="https://api.cf.neo-sa1.hana.ondemand.com"; APP_NAME="neo-ksa$RANDOM_STR" ;;
        esac

        # 用户自定义应用名称
        [ -n "${{ github.event.inputs.app_name }}" ] && APP_NAME="${{ github.event.inputs.app_name }}"

        # 确定 Docker 镜像
        if [ -n "${{ secrets.DOCKER_IMAGE }}" ]; then
          DOCKER_IMAGE="${{ secrets.DOCKER_IMAGE }}"
        elif [ "${{ github.event.inputs.type }}" = "ws直连" ]; then
          DOCKER_IMAGE="ghcr.io/eooce/ws:latest"
        elif [ "${{ github.event.inputs.type }}" = "xhttp直连" ]; then
          DOCKER_IMAGE="ghcr.io/eooce/goxhttp:latest"
        else
          DOCKER_IMAGE="ghcr.io/eooce/nodejs:main"
        fi

        echo "CF_API=$CF_API"
        echo "APP_NAME=$APP_NAME"
        echo "DOCKER_IMAGE=$DOCKER_IMAGE"

        # ── 2. 登录 CF ──
        cf login -a "$CF_API" -u "${{ secrets.EMAIL }}" -p "${{ secrets.PASSWORD }}"
        ORG=$(cf orgs | sed -n '4p')
        SPACE=$(cf spaces | sed -n '4p')
        echo "Org: $ORG / Space: $SPACE"
        cf login -a "$CF_API" -u "${{ secrets.EMAIL }}" -p "${{ secrets.PASSWORD }}" -o "$ORG" -s "$SPACE"
        cf target

        # ── 3. 部署 ──
        if cf push "$APP_NAME" --docker-image "$DOCKER_IMAGE" -m ${{ env.MEMORY }} -k ${{ env.DISK }} --health-check-type port; then
          echo "✅ 部署成功"
        else
          cf delete "$APP_NAME" -r -f
          echo "❌ 没资源了，部署失败，请明天早上8:20至9:00再尝试，已清理残留"
          exit 1
        fi

        # ── 4. 设置环境变量 ──
        cf set-env "$APP_NAME" NAME "SAP"
        cf set-env "$APP_NAME" UUID "${{ secrets.UUID }}"
        cf set-env "$APP_NAME" NEZHA_SERVER "${{ secrets.NEZHA_SERVER }}"
        cf set-env "$APP_NAME" NEZHA_PORT "${{ secrets.NEZHA_PORT }}"
        cf set-env "$APP_NAME" NEZHA_KEY "${{ secrets.NEZHA_KEY }}"
        cf set-env "$APP_NAME" ARGO_PORT "${{ secrets.ARGO_PORT }}"
        cf set-env "$APP_NAME" ARGO_DOMAIN "${{ secrets.ARGO_DOMAIN }}"
        cf set-env "$APP_NAME" ARGO_AUTH "${{ secrets.ARGO_AUTH }}"
        cf set-env "$APP_NAME" SUB_PATH "${{ secrets.SUB_PATH }}"
        cf set-env "$APP_NAME" CFIP "${{ secrets.CFIP || 'cf.877774.xyz' }}"
        cf set-env "$APP_NAME" CFPORT "${{ secrets.CFPORT }}"
        cf set-env "$APP_NAME" CHAT_ID "${{ secrets.CHAT_ID }}"
        cf set-env "$APP_NAME" BOT_TOKEN "${{ secrets.BOT_TOKEN }}"

        # 读取 .env 文件（如存在）
        if [ -f .env ]; then
          while IFS= read -r line; do
            if [[ ! "$line" =~ ^# ]] && [[ -n "$line" ]]; then
              IFS='=' read -r key value <<< "$line"
              cf set-env "$APP_NAME" "$key" "$value"
            fi
          done < .env
        fi

        # 直连镜像自动设置 DOMAIN
        if [[ "$DOCKER_IMAGE" =~ (xhttp|goxhttp|ws) ]]; then
          ROUTE=$(cf app "$APP_NAME" | grep "routes:" | awk '{print $2}')
          if [ -n "$ROUTE" ]; then
            echo "设置 DOMAIN: $ROUTE"
            cf set-env "$APP_NAME" DOMAIN "$ROUTE"
          else
            echo "⚠️ 未找到路由，请手动设置 DOMAIN"
          fi
        fi

        # ── 5. Restage 并输出信息 ──
        cf restage "$APP_NAME"
        cf app "$APP_NAME"

        echo ""
        echo "🚀 部署完成！"
        echo "区域: ${{ github.event.inputs.region }}"
        echo "Org: $ORG / Space: $SPACE"
        echo "应用名称: $APP_NAME"
        ROUTE=$(cf app "$APP_NAME" | grep "routes:" | awk '{print $2}')
        [ -n "$ROUTE" ] && echo "应用URL: https://$ROUTE" || echo "⚠️ 未找到路由"
